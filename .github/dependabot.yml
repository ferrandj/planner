version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd Node.js majors are short-lived "current" releases; stay on LTS (even) majors.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
