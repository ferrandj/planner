# Planner: ready to deploy. No secrets are needed.
#
# Synology (Container Manager): create the folder /volume1/docker/planner/data first, then
# Container Manager -> Project -> Create -> paste this file (or use "docker compose up -d" over SSH).
#
# The first start (empty data folder) fills the planner with the default schedule bundled in the image.
# From then on the data folder is the only source of truth: updating or re-creating the container never touches it.
services:
  planner:
    # The image is built and published by GitHub: there is NOTHING to build on the NAS (no "build:" line on purpose,
    # it would make Compose look for a Dockerfile in this folder instead of pulling the image).
    image: ghcr.io/ferrandj/planner:latest
    # :latest = newest release, :1 = only 1.x releases, :1.1.0 = pinned to one release.
    # To update: docker compose pull && docker compose up -d   (or let Watchtower do it, see the label below)
    container_name: planner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # <port on the NAS>:<port in the container, keep 8080>  ->  http://<nas-address>:10457
      - "10457:8080"
    volumes:
      # EVERYTHING you create lives in this folder: state, attachments, automatic backups (backups/).
      # Include it in your NAS backup (Hyper Backup, rsync, ...).
      - /volume1/docker/planner/data:/data
      # Optional: keep the readable copy of your notes and files (one folder per subject, then per class, notes.txt +
      # attachments) somewhere else, e.g. a folder already shared on your network. Uncomment BOTH this line and
      # LIBRARY_DIR below. Without them the copy is in data/library.
      # - /volume1/notes/planner:/library
    labels:
      # Lets Watchtower (if you run it) update this container automatically when a new release is published.
      - com.centurylinklabs.watchtower.enable=true

    # --- Only if needed -------------------------------------------------------------------------
    # Permissions need no setup: the container runs as whoever owns the data folder (and hands a folder that
    # Docker created as root to an unprivileged user). Set "user:" only to force one on purpose; then that user
    # must be able to write to the folder.
    # user: "UID:GID"
    #
    # Optional password for the whole app (otherwise protect it with your reverse proxy / VPN):
    # environment:
    #   LIBRARY_DIR: /library
    #   AUTH_USER: "<choose-a-user>"
    #   AUTH_PASSWORD: "<choose-a-password>"
